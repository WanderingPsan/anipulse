# Runs lint, the format check, and every test on each push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the tests marked `db` run instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anipulse
          POSTGRES_PASSWORD: anipulse
          POSTGRES_DB: anipulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anipulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://anipulse:anipulse@localhost:5432/anipulse
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -q
