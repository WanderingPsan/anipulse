# One look for every page: a light theme whose accent matches the chart accent in
# dashboard/style.py, so buttons, sliders, and highlighted bars are the same blue.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
